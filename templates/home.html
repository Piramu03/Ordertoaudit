{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Welcome, {{ user.username }}</h2>
  <p>Role: {{ user.get_role_display }}</p>
  {% if user.role == "auditor" or user.role == "owner" %}
    <a class="btn" href="{% url 'reports:index' %}">Reports</a>
    <a class="btn alt" href="{% url 'sales:invoice_list' %}">Invoices</a>
  {% else %}
    <p class="muted">Your screens are being built.</p>
  {% endif %}
</div>
{% endblock %}
